name: Check harness artifacts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-harness-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/build-harness-artifacts.sh scripts/check-guardrails-drift.sh scripts/assemble-skills.sh

      - name: Verify generated harness artifacts are up to date
        run: scripts/build-harness-artifacts.sh --check

      - name: Verify shared skills guardrails are in sync
        run: scripts/check-guardrails-drift.sh

      - name: Verify assembled skills are up to date
        run: scripts/assemble-skills.sh --check
